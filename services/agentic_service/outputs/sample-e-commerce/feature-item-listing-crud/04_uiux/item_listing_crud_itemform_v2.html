<section class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-blue-900">Edit Item</h1>
    <p class="text-gray-600 mt-1">Update the item details below</p>
  </div>

  <form class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Item Name -->
      <div class="md:col-span-2">
        <label for="item-name" class="block text-sm font-medium text-blue-900 mb-1">Item Name</label>
        <input 
          type="text" 
          id="item-name" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          value="Wireless Bluetooth Headphones"
        >
      </div>

      <!-- Description -->
      <div class="md:col-span-2">
        <label for="item-description" class="block text-sm font-medium text-blue-900 mb-1">Description</label>
        <textarea 
          id="item-description" 
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >Premium noise-cancelling headphones with 30-hour battery life and crystal clear audio quality.</textarea>
      </div>

      <!-- Price -->
      <div>
        <label for="item-price" class="block text-sm font-medium text-blue-900 mb-1">Price ($)</label>
        <input 
          type="number" 
          id="item-price" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          value="129.99"
          step="0.01"
          min="0.01"
        >
      </div>

      <!-- Stock Quantity -->
      <div>
        <label for="item-quantity" class="block text-sm font-medium text-blue-900 mb-1">Stock Quantity</label>
        <input 
          type="number" 
          id="item-quantity" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          value="42"
          min="0"
        >
      </div>

      <!-- Category -->
      <div>
        <label for="item-category" class="block text-sm font-medium text-blue-900 mb-1">Category</label>
        <select 
          id="item-category" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="electronics">Electronics</option>
          <option value="clothing" selected>Clothing</option>
          <option value="home">Home & Kitchen</option>
          <option value="books">Books</option>
        </select>
      </div>

      <!-- Image Preview -->
      <div>
        <label class="block text-sm font-medium text-blue-900 mb-1">Image Preview</label>
        <div class="flex items-center space-x-4">
          <div class="w-24 h-24 bg-gray-200 rounded-lg flex items-center justify-center flex-shrink-0">
            <svg class="w-10 h-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
            </svg>
          </div>
          <div>
            <button type="button" class="text-blue-600 hover:text-blue-800 text-sm font-medium">Change Image</button>
            <p class="text-xs text-gray-500 mt-1">JPG, GIF or PNG. Max size of 2MB</p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-end space-x-3 pt-4">
      <button 
        type="button" 
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >
        Cancel
      </button>
      <button 
        type="submit" 
        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        Update Item
      </button>
    </div>
  </form>
</section>
